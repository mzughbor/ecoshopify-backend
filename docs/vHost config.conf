docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               admin@falcon.codes
enableGzip                1
enableIpGeo               1

index {
  useServer               0
  indexFiles              index.php, index.html
}

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

extprocessor ecoshopify-frontend {
  type                    proxy
  address                 http://127.0.0.1:5001
  maxConns                100
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      60
  respBuffer              0
  autoStart               0
  path                    /bin/true
  extUser                 ecosh2554
  extGroup                ecosh2554
}

extprocessor ecoshopify-backend {
  type                    proxy
  address                 http://127.0.0.1:5000
  maxConns                100
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      60
  respBuffer              0
  autoStart               0
  path                    /bin/true
  extUser                 ecosh2554
  extGroup                ecosh2554
}

phpIniOverride {
}

module cache {
  storagePath /usr/local/lsws/cachedata/$VH_NAME
}

rewrite {
  enable                  1
  autoLoadHtaccess        1
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite {
    enable                0
  }

  addDefaultCharset       off

  phpIniOverride {
  }
}

context / {
  type                    proxy
  handler                 ecoshopify-frontend
  addDefaultCharset       off
}

context /api {
  type                    proxy
  handler                 ecoshopify-backend
  addDefaultCharset       off
}

vhssl {
  keyFile                 /etc/letsencrypt/live/ecoshopify.com/privkey.pem
  certFile                /etc/letsencrypt/live/ecoshopify.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
  ocspRespMaxAge          86400
}